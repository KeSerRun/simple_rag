[storage]
# 数据存储根目录（所有用户数据、会话历史、文档索引均在此目录下）
data_dir = data
# 向量索引存储路径（FAISS 索引文件 + metadata.json）
vector_store_dir = data/vector_store
# 存储后端类型（目前仅支持 json — 基于 JSON 文件的本地持久化）
backend = json

[retrieval]
# FAISS 召回阶段的候选数（超过此数量后 LLM 不可见，仅用于去重池）
retrieval_top_k = 50
# search_knowledge_base 的默认返回结果数（LLM 可通过 top_k 参数覆盖，上限不超过 retrieval_top_k）
candidate_top_k = 10
# 知识库片段的最低有效字符数（低于此长度的 text 类片段会被丢弃）
min_chunk_length = 30
# 停用词表：包含这些词的 text 片段会被过滤掉（逗号分隔）
stop_words = 邮编, 电话, 传真, 邮箱, 网址, 地址, 市, 区, 报告, 公司, @, com, 首席分析师, 研究助理, 硕士, 博士, 大学

[api]
# LLM / Embedding API / MinerU 请求超时时间（秒）
timeout = 60
# LLM / Embedding API / MinerU 请求失败时的自动重试次数
max_retries = 3
# 对话模型 API Key（支持 OpenAI 兼容接口）
chat_api_key = 
# 对话模型 API 入口地址
chat_base_url = 
# 对话模型名称
chat_model = deepseek-v4-flash
# 深度思考强度（low / medium / high / xhigh / max）
chat_reasoning_effort = medium
# Embedding 模型 API Key（留空则复用 chat_api_key）
embedding_api_key = 
# Embedding 模型 API 入口地址（留空则复用 chat_base_url）
embedding_base_url = 
# Embedding 模型名称
embedding_model = BAAI/bge-m3
# Embedding 向量维度（必须与模型匹配）
embedding_dim = 1024
# MinerU 文档解析服务 API Key（用于 PDF 解析）
mineru_api_key = 
# MinerU 服务 API 地址
mineru_base_url = 
# MinerU 令牌名称
mineru_token_name = default
# MinerU 模型版本
mineru_model_version = vlm
# MinerU 解析语言（ch = 中文）
mineru_language = ch

[agent]
# 单次对话中工具调用的最大轮次（防止工具循环无限执行）
max_tool_iter = 50
# LLM 单次响应的最大输出字符数 10W
max_output_chars = 100000
# 上下文治理：单条工具结果的硬上限（超过此长度直接截断）
max_tool_result_chars = 20000
# 评估任务的最大并行工作线程数
eval_max_workers = 3
# 文档解析的最大并行工作线程数
parse_workers = 8

[search]
# 联网搜索后端（duckduckgo / searxng / bocha / bing）
backend = duckduckgo
# SearXNG 自建实例地址（backend=searxng 时必填）
searxng_url =
# 博查 AI Search API Key（backend=bocha 时必填）
bocha_api_key =
# Bing Web Search API Key（backend=bing 时必填）
bing_api_key =
# 搜索请求超时时间（秒）
timeout = 15

[conversation_history]
# 历史对话保留的最大轮次（超过此数量时丢弃最早的轮次）
max_history_length = 200
# 上下文窗口总字符预算（输入 + 输出的总和上限）50W 字符
context_window_chars = 500000
# 输入消息压缩的临界占用比例（默认 0.8 = 80%），超出时从最早的消息开始依次压缩每轮对话
context_input_ratio = 0.8
# 历史压缩比例：当字符超预算时，将早期对话压缩到此比例
consolidation_ratio = 0.5

[governance]
# 工具结果阈值：超过此长度（字符）时写入文件并压缩为摘要
persist_threshold = 12000
# 持久化引用中所包含的内容预览长度（字符）
preview_chars = 200
# 工具分页读取每页字符数（read_full_document / read_tool_result 分页大小）
tool_page_chars = 10000

[superuser]
# 超级用户名列表（逗号分隔，拥有管理员权限）
users = Admin123,Super123
# 超级用户密码列表（与 users 一一对应）
passwords = Admin123,Super123

[logger]
# 日志文件输出目录
log_path = logs
# 控制台日志级别（DEBUG / INFO / WARNING / ERROR）
console_log_level = DEBUG
# 应用日志级别（DEBUG / INFO / WARNING / ERROR）
app_log_level = DEBUG
# HTTP 请求日志级别（DEBUG / INFO / WARNING / ERROR）
http_log_level = DEBUG
# 用户操作日志级别（DEBUG / INFO / WARNING / ERROR）
user_log_level = DEBUG

[upload]
# 单个用户上传文件的总存储上限（MB）
max_user_storage_mb = 10


