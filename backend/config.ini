[storage]
data_dir = data
vector_store_dir = data/vector_store
backend = json

[retrieval]
retrieval_top_k = 30
candidate_top_k = 5
min_chunk_length = 30
stop_words = 邮编, 电话, 传真, 邮箱, 网址, 地址, 市, 区, 报告, 公司, @, com, 首席分析师, 研究助理, 硕士, 博士, 大学

[api]
timeout = 60
max_retries = 3
chat_api_key = sk-7*******************************
chat_base_url = https://api.deepseek.com
chat_model = deepseek-v4-flash
chat_reasoning_effort = medium
embedding_api_key = sk-y***********************************************
embedding_base_url = https://api.siliconflow.cn/v1
embedding_model = BAAI/bge-m3
embedding_dim = 1024
mineru_api_key = eyJ0*****************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************
mineru_base_url = https://mineru.net/api/v4
mineru_token_name = default
mineru_model_version = vlm
mineru_language = ch

[agent]
max_tool_iter = 8
max_calls_per_tool = 3
max_output_tokens = 8192
parse_workers = 8
tool_call_workers = 4

[search]
backend = duckduckgo
searxng_url = Admin123
bocha_api_key = Admi***
bing_api_key = 
timeout = 15

[conversation_history]
max_history_length = 200
max_history_chars = 100000

[superuser]
users = Admin123,Super123
passwords = Admin123,Super123

[logger]
log_path = logs
console_log_level = DEBUG
app_log_level = DEBUG
http_log_level = DEBUG
user_log_level = DEBUG

[upload]
max_user_storage_mb = 10

