# Storage 配置
[storage]
data_dir = data
vector_store_dir = data/vector_store

# RAG 检索配置
[retrieval]
parent_chunk_size = 200
child_chunk_size = 50
chunk_overlap = 20
retrieval_top_k = 20
candidate_top_k = 5

# LLM 配置
[api]
# ─── 通用（适用于以下所有子端）───────────────
timeout = 60
max_retries = 3

# ─── Chat 端 ────────────────────────────────────
chat_api_key = sk-xxx
chat_base_url = https://opencode.ai/zen/go/v1   
chat_model = deepseek-v4-flash
chat_reasoning_effort = medium

# ─── Embedding 端 ─────────────────────────────
# 留空则回退到 chat 端配置
embedding_api_key = sk-xxx
embedding_base_url = https://api.siliconflow.cn/v1
embedding_model = BAAI/bge-m3
embedding_dim = 1024

# ─── MinerU (PDF 结构化解析) ─────────────────
mineru_api_key = eyJxxx
mineru_base_url = https://mineru.net/api/v4
mineru_token_name = default
mineru_model_version = vlm
mineru_language = ch

# Agent 配置
[agent]
# 每轮对话最大工具调用次数（达到上限后强制返回）
max_tool_iter = 6
# 历史摘要模型（留空则复用 chat_model，可设轻量模型省钱）
summary_model =

# 联网搜索配置
[search]
# duckduckgo (默认, 国际可用) | searxng (国内可用, 需自建或找公开实例)
backend = duckduckgo
# SearXNG 实例地址 (仅 backend=searxng 时使用)
searxng_url =
# 搜索请求超时（秒）
timeout = 15

# 对话历史配置
[conversation_history]
# 保留的最大对话轮次（超过后压缩）
max_history_length = 50
# 对话历史总字符数上限（超过后压缩，约等于 4× token 数）
max_history_chars = 5000

# 超级管理员（启动时自动创建）
[superuser]
users = Admin123,Super123
passwords = Admin123,Super123

# 日志配置
[logger]
log_path = logs
log_file_level = INFO
log_console_level = DEBUG
