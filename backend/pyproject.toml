[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-simple-backend"
version = "0.2.0"
description = "智能 RAG Agent 问答系统后端：Tool-calling 循环 + LLM Listwise Rerank + 工作流路由，无 LangChain 依赖"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RAG-Simple Contributors"},
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Web 服务
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "PyJWT>=2.8",
    # LLM / Embedding API
    "openai>=1.50",
    # 向量检索
    "faiss-cpu>=1.10.0",
    "numpy>=2.0",
    # 文档加载与 OCR (仅 PDF 兜底路径使用 PyMuPDF + RapidOCR)
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "opencv-python>=4.10",
    "rapidocr-onnxruntime>=1.4",
    "tqdm>=4.66",
    # MinerU PDF 结构化解析
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # 工具
    "rich>=13.7",
    "httpx>=0.28",
    "readability-lxml>=0.8",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.4",
    # Token 估算
    "tiktoken>=0.9",
]

[tool.setuptools.packages.find]
include = ["rag_simple_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"

