[storage]
# 数据存储根目录
data_dir = data
# 向量数据库文件存储路径
vector_store_dir = data/vector_store
# 后端类型（当前仅支持 json）
backend = json

[retrieval]
# 检索返回的最相似结果数
retrieval_top_k = 50
# 候选文档数量（重排序前的候选数）
candidate_top_k = 10
# 文档块最小字符数（低于此值会被过滤）
min_chunk_length = 30
# 文本块过滤停用词
stop_words = 邮编, 电话, 传真, 邮箱, 网址, 地址, 市, 区, 报告, 公司, @, com, 首席分析师, 研究助理, 硕士, 博士, 大学

[api]
# LLM API 请求超时时间（秒）
timeout = 60
# LLM API 请求最大重试次数
max_retries = 3
# 对话模型 API 密钥
chat_api_key = sk-w***************************************************************
# 对话模型 API 地址
chat_base_url = https://opencode.ai/zen/go/v1
# 对话模型名称
chat_model = deepseek-v4-flash
# 模型推理力度（low/medium/high）
chat_reasoning_effort = medium
# 嵌入模型 API 密钥
embedding_api_key = sk-y***********************************************
# 嵌入模型 API 地址
embedding_base_url = https://api.siliconflow.cn/v1
# 嵌入模型名称
embedding_model = BAAI/bge-m3
# 嵌入向量维度
embedding_dim = 1024
# MinerU PDF 解析 API 密钥（JWT token）
mineru_api_key = eyJ0*****************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************************
# MinerU API 地址
mineru_base_url = https://mineru.net/api/v4
# MinerU Token 名称
mineru_token_name = default
# MinerU 模型版本（vlm / lite）
mineru_model_version = vlm
# MinerU 处理语言
mineru_language = ch
# MinerU 最大并发数（超出此限制时排队等待，避免 API 限流）
mineru_max_concurrency = 3

[agent]
# 工具调用最大迭代次数（达上限后保存中断状态，用户可回复「继续」恢复）
max_tool_iter = 50
# 单次 LLM 输出的最大字符数
max_output_chars = 10000
# 评估任务最大并发查询数
eval_max_workers = 3

[search]
# 搜索后端（duckduckgo / searxng / bocha / bing）
backend = duckduckgo
# SearXNG 服务地址（仅 backend=searxng 时使用）
searxng_url = xxx
# 博查搜索 API 密钥（仅 backend=bocha 时使用）
bocha_api_key = xxx
# Bing 搜索 API 密钥（仅 backend=bing 时使用）
bing_api_key = xxx
# 搜索请求超时时间（秒）
timeout = 15

[governance]
# 历史对话最大保留轮次
max_history_length = 200
# 上下文窗口总字符预算（输入 + 输出总和上限）
context_window_chars = 20000
# 输入占用上下文窗口的比例（剩余给输出）
context_input_ratio = 0.8
# 压缩比例
compression_ratio = 0.8
# 工具结果分段读取的每页字符数
tool_page_chars = 10000

[superuser]
# 超级管理员用户名列表（逗号分隔）
users = Admin123,Super123
# 超级管理员密码列表（逗号分隔，与 users 一一对应）
passwords = Admin123,Super123

[logger]
# 日志文件输出目录
log_path = logs
# 控制台日志级别
console_log_level = DEBUG
# 应用日志级别
app_log_level = DEBUG
# HTTP 请求日志级别
http_log_level = DEBUG
# 用户操作日志级别
user_log_level = DEBUG

[upload]
# 每个用户的最大存储空间（MB）
max_user_storage_mb = 10
