# Storage 配置
[storage]
# 数据目录（用户/会话/QA对/历史记录）
data_dir = data
# 向量存储目录（FAISS 索引 + 文档元数据）
vector_store_dir = data/vector_store

# RAG 检索配置
[retrieval]
# 父块切分尺寸
parent_chunk_size = 200
# 子块切分尺寸
child_chunk_size = 50
# 块重叠尺寸
chunk_overlap = 20
# 检索结果的 top k 配置
retrieval_top_k = 10
# 重排序结果的 top k 配置
candidate_top_k = 5

# 日志配置
[logger]
# 日志文件路径
log_file = logs/app.log
# 日志文件级别配置
log_file_level = INFO
# 日志控制台级别配置
log_console_level = DEBUG

# OpenAI 兼容 API 配置：chat 与 embedding 可独立指向不同服务商
[api]
# ─── Chat 端配置（当前指向 DeepSeek）──────────────
# 优先从环境变量 OPENAI_API_KEY 读取，配置项作为兜底
api_key = sk-9203321a975d4e83b43c219d783added
# DeepSeek OpenAI 兼容端点
base_url = https://api.deepseek.com
# RAG agent 主模型: 同时负责工具调用决策 / 检索查询生成 / 最终答案
chat_model = deepseek-chat

# ─── Embedding 端配置（当前指向 SiliconFlow）─────
# 单独的 embedding API key;留空则回退到上面的 api_key
# 优先从环境变量 OPENAI_EMBEDDING_API_KEY 读取，配置项作为兜底
embedding_api_key = sk-ytbfnbrntcthbrcfhhqknygopwfpkfpdmivrxzswvmmpqgaz
# 单独的 embedding base_url;留空则回退到上面的 base_url
embedding_base_url = https://api.siliconflow.cn/v1
# Embedding 模型
embedding_model = BAAI/bge-m3
# Embedding 维度（必须与所选 embedding 模型对应,BAAI/bge-m3=1024,text-embedding-3-small=1536）
embedding_dim = 1024

# ─── 通用 ────────────────────────────────────────
# 请求超时(秒)
timeout = 60
# 最大重试次数
max_retries = 3

# 评估配置
[assessment]
# ARGAS评估数据文件路径
rag_evaluate_data = data/rag_evaluate/rag_evaluate_data.jsonl

# 对话历史配置
[conversation_history]
# 对话历史最大长度配置
max_history_length = 10

# HTML主页配置
[html]
# HTML主页文件路径(相对于 backend/ 根目录)
index_file = dist/index.html

# jwt配置
[jwt]
# jwt密钥
secret_key = "8bc38821c731de3a3520ad3672dda461d00428514fb1382fc73c67dc2dfb791f"

# superuser配置
[superuser]
# 超级用户列表，逗号分隔
users = Admin123,Super123
passwords = Admin123,Super123

