# MySQL 配置
[mysql]
# 主机地址
host = localhost
# 端口号
port = 3306
# 用户名
user = root
# 密码
password = 123456
# 数据库名称
database = fqa

# Redis 配置
[redis]
# 主机地址
host = localhost
# 端口号
port = 6379
# 密码
password = ''
# 数据库索引
db = 0

# Milvus 配置
[milvus]
# 主机地址
host = localhost
# 端口号
port = 19530
# 数据库名称
database = qa
# 集合名称
collection = qa_collection
# 向量维度
vector_dim = 128
# 距离度量类型
metric_type = COSINE
# 索引类型
index_type = IVF_FLAT
# 索引参数
vector_store_path = data/vector_store

# RAG 检索配置
[retrieval]
# 父块切分尺寸
parent_chunk_size = 200
# 子块切分尺寸
child_chunk_size = 50
# 块重叠尺寸
chunk_overlap = 20
# 检索结果的 top k 配置
retrieval_top_k = 10
# 重排序结果的 top k 配置
candidate_top_k = 5
# 密集检索权重配置
dense_weight = 1.0
# 稀疏检索权重配置
sparse_weight = 0.7

# 日志配置
[logger]
# 日志文件路径
log_file = logs/app.log
# 日志文件级别配置
log_file_level = INFO
# 日志控制台级别配置
log_console_level = DEBUG

# 问答对数据配置
[qa_data]
# 问答对数据文件路径
qa_data_file = data/mysql_qa/qa_data.csv
# 问答对数据的列名配置
class_head_name = 学科名称
# 问题列名
question_head_name = 问题
# 答案列名
answer_head_name = 答案

# BM25 配置
[bm25]
# BM25 检索阈值
similarity_threshold = 0.95

# model 配置
[model]
# 文档切分模型
segment_model = model/nlp_bert_document-segmentation_chinese-base
# 重排序模型
reranker_model = model/bge-reranker-v2-m3
# 嵌入模型
embedding_model = model/bge-m3
# 策略选择模型
strategy_selector_model = model/qwen-2.5-0.5b-instruct
# 大语言模型
llm_model = model/qwen-2.5-1.5b-instruct

# 意图识别训练数据配置
[query_classifier]
# 预训练模型
query_classifier_pretrained = model/bert-base-chinese
# 微调后的模型
query_classifier_model = model/bert-classifier-base
# 训练数据文件
query_classifier_train_data_file = data/query_classify/augmented_data.jsonl
# 评估数据文件
query_classifier_eval_data_file = data/query_classify/model_generic_500.jsonl
# 分类标签
query_classifier_labels = 需要,不需要

# 评估配置
[assessment]
# ARGAS评估数据文件路径
rag_evaluate_data = data/rag_evaluate/rag_evaluate_data.jsonl

# 对话历史配置
[conversation_history]
# 对话历史最大长度配置
max_history_length = 10

# HTML主页配置
[html]
# HTML主页文件路径
index_file = ../frontend/dist/index.html

# jwt配置
[jwt]
# jwt密钥
secret_key = "8bc38821c731de3a3520ad3672dda461d00428514fb1382fc73c67dc2dfb791f"